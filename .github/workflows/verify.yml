name: Verify public engine SDK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run lint
      - run: npm run format:check
      - name: Repeated build leaves tracked files unchanged
        run: npm run build && git diff --exit-code && test -z "$(git status --porcelain)"

  browser:
    # Headless Chrome with SwiftShader. These batches prove geometry, paint,
    # input and lifecycle contracts; they are not GPU/device acceptance.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prefab browser gate
        run: PREFAB_FIXTURE_DIR=/tmp/zhuda-browser/prefab npm run verify:prefab-browser
      - name: Prefab editor batches
        run: |
          EDITOR_RESPONSIVE_EVIDENCE_DIR=/tmp/zhuda-browser/editor/responsive npm run verify:prefab-editor-responsive
          EDITOR_EVIDENCE_DIR=/tmp/zhuda-browser/editor npm run verify:prefab-editor
          EDITOR_PLAY_EVIDENCE_DIR=/tmp/zhuda-browser/editor/play npm run verify:prefab-editor-play
      - name: Consumer runtime batches
        run: |
          FACTORY_OUT=/tmp/zhuda-browser/slot-foundation npm run verify:slot-foundation
          RUNTIME_FIXTURE_DIR=/tmp/zhuda-browser/runtime-feedback npm run verify:runtime-feedback
          CROWD_FIXTURE_DIR=/tmp/zhuda-browser/crowd npm run verify:crowd
          npm run build:browser
          SDK_EVIDENCE_DIR=/tmp/zhuda-browser/branding npm run verify:branding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: /tmp/zhuda-browser/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run audit:declarations
      - run: npm test
      # Hosted CI is not a Windows hardware WebGPU acceptance run.
