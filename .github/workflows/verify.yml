name: Verify public engine SDK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run verify
      - run: PREFAB_FIXTURE_DIR=/tmp/zhuda-prefab-browser node scripts/verify-prefab-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefab-browser-evidence
          path: /tmp/zhuda-prefab-browser/evidence/
