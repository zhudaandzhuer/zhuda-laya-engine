# Actions are pinned to a commit, with the release it is in the comment: a tag such as v4 can be
# moved to other code, a commit cannot. To take a newer release, replace the hash and the comment
# together (`gh api repos/actions/checkout/commits/<tag> --jq .sha`).
name: Verify public engine SDK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run lint
      - run: npm run format:check
      - name: Repeated build leaves tracked files unchanged
        run: npm run build && git diff --exit-code && test -z "$(git status --porcelain)"

  games:
    # The reference games under games/ are consumers of this checkout: an engine
    # change that breaks one fails here. Software only; not device acceptance.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:games

  browser:
    # Headless Chrome with SwiftShader. These batches prove geometry, paint,
    # input and lifecycle contracts; they are not GPU/device acceptance.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prefab browser gate
        run: PREFAB_FIXTURE_DIR=/tmp/zhuda-browser/prefab npm run verify:prefab-browser
      - name: Prefab editor batches
        run: |
          EDITOR_RESPONSIVE_EVIDENCE_DIR=/tmp/zhuda-browser/editor/responsive npm run verify:prefab-editor-responsive
          EDITOR_EVIDENCE_DIR=/tmp/zhuda-browser/editor npm run verify:prefab-editor
          EDITOR_PLAY_EVIDENCE_DIR=/tmp/zhuda-browser/editor/play npm run verify:prefab-editor-play
      - name: Consumer runtime batches
        run: |
          FACTORY_OUT=/tmp/zhuda-browser/slot-foundation npm run verify:slot-foundation
          RUNTIME_FIXTURE_DIR=/tmp/zhuda-browser/runtime-feedback npm run verify:runtime-feedback
          CROWD_FIXTURE_DIR=/tmp/zhuda-browser/crowd npm run verify:crowd
          npm run build:browser
          SDK_EVIDENCE_DIR=/tmp/zhuda-browser/branding npm run verify:branding
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-evidence
          path: /tmp/zhuda-browser/

  macos:
    # The base layer on the engine's own development platform.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # A folder with spaces and CJK, as a consumer's often is (WIN-01..04
        # of docs/plans/records/windows-acceptance/plan.md).
        working-directory: zhuda engine 測試
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: zhuda engine 測試
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: zhuda engine 測試/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run audit:declarations
      - run: npm test
      # The packed SDK through npm (no shell), dependency junctions, file-URL
      # imports and the browser launcher's own cleanup, in a software-rendered
      # Chrome. Not a Windows hardware or WebGPU acceptance run: that needs the
      # signed-in desktop session of a machine with the GPU (see
      # docs/agent-development.md, "Windows hardware runs").
      - name: Consumer runtime batches
        shell: pwsh
        run: |
          $env:FACTORY_OUT = "$env:RUNNER_TEMP\zhuda-browser\slot-foundation"
          npm run verify:slot-foundation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUNTIME_FIXTURE_DIR = "$env:RUNNER_TEMP\zhuda-browser\runtime-feedback"
          npm run verify:runtime-feedback
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: No check left a browser running
        shell: pwsh
        run: |
          $left = @(Get-CimInstance Win32_Process -Filter "Name='chrome.exe' OR Name='msedge.exe'" | Where-Object { $_.CommandLine -match 'zhuda-(runtime|prefab)-browser-|zhuda-browser-' })
          if ($left.Count) { $left | ForEach-Object { $_.CommandLine }; exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-browser-evidence
          path: ${{ runner.temp }}/zhuda-browser/
