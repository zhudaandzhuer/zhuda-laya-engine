async function download(s) {
  const blob = await render(s); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = s.id + '.wav'; a.click();
}
// 給自動化匯出用：回傳某個音效的 WAV base64
window.renderBase64 = async id => {
  const blob = await render(SFX.find(s => s.id === id)); const u8 = new Uint8Array(await blob.arrayBuffer());
  let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000));
  return btoa(s);
};
window.SFX_IDS = SFX.map(s => s.id);

/* ========= 介面 ========= */
const list = document.getElementById('list');
[...new Set(SFX.map(s => s.group))].forEach(gname => {
  const h = document.createElement('h2'); h.textContent = gname; list.appendChild(h);
  const g = document.createElement('div'); g.className = 'grid'; list.appendChild(g);
  SFX.filter(s => s.group === gname).forEach(s => {
    const el = document.createElement('div'); el.className = 's';
    el.innerHTML = `<b>${s.name}</b><code>${s.id}</code><span>${s.use}</span><div class="row"><button>▶ 試聽</button><button>⬇ WAV</button></div>`;
    const [p, d] = el.querySelectorAll('button'); p.onclick = () => play(s); d.onclick = () => download(s);
    g.appendChild(el);
  });
});
let stopAll = false;
document.getElementById('all').onclick = async () => { stopAll = false; for (const s of SFX) { if (stopAll) break; const L = play(s); await new Promise(r => setTimeout(r, (Math.min(L, 4) + 0.35) * 1000)); } };
document.getElementById('stop').onclick = () => { stopAll = true; if (live) { live.close(); live = null; } };
document.getElementById('zip').onclick = async () => { for (const s of SFX) { await download(s); await new Promise(r => setTimeout(r, 250)); } };
</script>
</body>
</html>
