<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zhuda 2D · 單一 HTML 範例</title>
<style>body{margin:0;padding:20px;background:#101c2a;color:#e5f1ff;font:16px/1.5 system-ui}main{max-width:900px;margin:auto}#view{position:relative;width:min(100%,640px);aspect-ratio:4/3;overflow:hidden;background:#152030}button{padding:10px;margin:12px 8px 12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}a{color:#72d6eb}</style></head>
<body><main><h1>Zhuda 2D / 1.15.0</h1><p>一份 HTML，以官方公開 API 建立 Prefab。按鈕切換同一份定義的狀態。</p><div id="view" aria-label="引擎畫布"></div><button id="toggle" disabled>切換狀態</button><button id="cycles" disabled>驗證 30 次建立／釋放</button><button id="dispose" disabled>釋放場景</button><pre id="sdk-report">載入中</pre></main>
<script src="https://game.qianlongxundao.com/apps/zhuda-engine-sdk/releases/9c61e10983b1ba814a16104b4e790f0b/zhuda-2d.js" integrity="sha384-pjQaJ62vNI0OdKiXKu3yfckWIVuBFKNObpi37KMmCAD8ra03qT/r6x2YbOsD++S8" onerror="document.querySelector('#sdk-report').textContent='SDK 載入失敗：檢查網址、網路、CSP 與 integrity';" crossorigin="anonymous"></script>
<script>
const {ZhudaEngine,Zhuda3D,ZhudaPrefabLibrary,ZhudaResourceScope,inspectSceneResources}=Zhuda;
const scope=new ZhudaResourceScope(),cancel=new AbortController();scope.defer(()=>cancel.abort());
window.addEventListener('pagehide',()=>scope.dispose(),{once:true});
const params=new URLSearchParams(location.search),id='browser-2d';
const definition={"id":"browser-2d","asset":"panel.lh","states":{"idle":{},"turned":{"Body":{"x":220}}}};
const panel={_$ver:1,_$id:'panel',_$type:'Sprite',name:'Root',width:640,height:480,_$child:[{_$id:'body',_$type:'Sprite',name:'Body',x:160,y:140,width:240,height:200,_gcmds:[{_$type:'DrawRectCmd',x:0,y:0,width:240,height:200,fillColor:'#26a6f2',lineColor:'#b6e8ff',lineWidth:3,percent:false}]}]};
const provider={name:'inline-neutral',async load(asset,options){if(options?.signal?.aborted)throw new DOMException('Cancelled','AbortError');if(asset!=='panel.lh')throw Error('Unknown logical asset');return {id:asset,bytes:new TextEncoder().encode(JSON.stringify(panel))};},dispose(){}};
let context,library,instance,ready=false,error,disposed=false,state=params.get('state')||'idle';
let lifecycle=[],lifecycleCheck={requestedCycles:0,completedCycles:0,status:'running',before:null,after:null};
const selection={id,state,node:params.get('node')||''};
const report=()=>({ready,error,renderer:context?.renderer,selection,provenance:instance?.provenance,resources:library?.report(),lifecycle,lifecycleCheck,bundle:ZhudaBundle,sdkExports:Object.keys(Zhuda).sort(),viewport:[innerWidth,innerHeight],dpr:devicePixelRatio,canvas:context?[context.canvas.width,context.canvas.height]:null,sceneResources:context?inspectSceneResources():null,disposed});
const show=()=>document.querySelector('#sdk-report').textContent=JSON.stringify(report(),null,2);
window.__ZHUDA_PREFAB_TEST__={report};
async function runCycles(count,parent){
 ready=false;lifecycle=[];lifecycleCheck={requestedCycles:count,completedCycles:0,status:'running',before:inspectSceneResources(),after:null};
 for(let i=0;i<count;i++){instance.dispose();instance=undefined;lifecycle.push(library.report());instance=await library.instantiate(id,{parent,state,signal:cancel.signal});ZhudaEngine.flushRenderFrames(3);lifecycleCheck.completedCycles++;}
 lifecycleCheck.after=inspectSceneResources();lifecycleCheck.status='complete';ready=true;show();
}
async function main(){
 if(params.has('id')&&params.get('id')!==id)throw Error('Unknown prefab id');
 const cycles=Number(params.get('cycles')||0);if(!Number.isSafeInteger(cycles)||cycles<0||cycles>100)throw Error('Invalid cycles');
 const width=Number(params.get('width')||640),height=Number(params.get('height')||480),dpr=Number(params.get('dpr')||1.5);
 if(![width,height,dpr].every(Number.isFinite)||width<1||height<1||width>4096||height>4096)throw Error('Invalid viewport');
 const view=document.querySelector('#view');if(params.has('width')){view.style.width=width+'px';view.style.height=height+'px';}
 context=scope.own(await ZhudaEngine.boot({renderer:ZhudaBundle.renderer,container:view,width,height,dprCap:dpr,features:[...ZhudaBundle.features],preserveDrawingBuffer:true}),value=>value.dispose());
 scope.own(provider,value=>value.dispose());library=scope.own(new ZhudaPrefabLibrary({provider,definitions:[definition],share3DResources:true}),value=>value.dispose());
 let parent=context.rootScene;

 instance=await library.instantiate(id,{parent,state,signal:cancel.signal});
 if(selection.node){const target=instance.find(selection.node);const keep=new Set();for(let p=target;p;p=p.parent)keep.add(p);const walk=node=>{for(let i=0;i<node.numChildren;i++){const child=node.getChildAt(i);if(!keep.has(child)&&node!==target)child[instance.provenance.kind==='3d'?'active':'visible']=false;else walk(child);}};walk(instance.root);}
 context.runtime.start(()=>{});await document.fonts.ready;ZhudaEngine.flushRenderFrames(3);
 while(!window.__ZHUDA_SPLASH__?.completed){if(cancel.signal.aborted)throw Error('Disposed');await new Promise(requestAnimationFrame);}
 await runCycles(cycles,parent);
 document.querySelectorAll('button').forEach(button=>button.disabled=false);
 document.querySelector('#toggle').onclick=()=>{state=state==='idle'?'turned':'idle';selection.state=state;instance.applyState(state);ZhudaEngine.flushRenderFrames(3);show();};
 document.querySelector('#cycles').onclick=async()=>{document.querySelectorAll('button').forEach(button=>button.disabled=true);try{await runCycles(30,parent);}catch(e){error=String(e);show();}finally{if(!disposed)document.querySelectorAll('button').forEach(button=>button.disabled=false);}};
 document.querySelector('#dispose').onclick=()=>{scope.dispose();instance=undefined;ready=false;disposed=true;document.querySelectorAll('button').forEach(button=>button.disabled=true);show();};
}
main().catch(e=>{error=String(e);scope.dispose();instance=undefined;ready=false;show();});
</script></body></html>
